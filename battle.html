<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Realm of Towers - Battle</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Training Tower</h1>

<div class="battle-header">

    <div>
        Enemy Base HP:
        <span id="enemyBaseHp">1000</span>
    </div>

    <div>
        Energy:
        <span id="energy">0</span>
    </div>

    <div>
        Floor:
        <span id="floorDisplay">1</span>
    </div>

</div>

<div id="selectedCardText">
Selected Card: None
</div>

<div id="cardBar"></div>

<hr>

<div id="battlefield">

    <div class="battle-lane" data-lane="0">
        <div class="lane-title">Lane 1</div>

        <div class="lane-row">

            <div class="player-base">
                🏰
            </div>

            <div class="lane-field" id="lane0"></div>

            <div class="enemy-base">
                👹
            </div>

        </div>
    </div>

    <div class="battle-lane" data-lane="1">
        <div class="lane-title">Lane 2</div>

        <div class="lane-row">

            <div class="player-base">
                🏰
            </div>

            <div class="lane-field" id="lane1"></div>

            <div class="enemy-base">
                👹
            </div>

        </div>
    </div>

    <div class="battle-lane" data-lane="2">
        <div class="lane-title">Lane 3</div>

        <div class="lane-row">

            <div class="player-base">
                🏰
            </div>

            <div class="lane-field" id="lane2"></div>

            <div class="enemy-base">
                👹
            </div>

        </div>
    </div>

    <div class="battle-lane" data-lane="3">
        <div class="lane-title">Lane 4</div>

        <div class="lane-row">

            <div class="player-base">
                🏰
            </div>

            <div class="lane-field" id="lane3"></div>

            <div class="enemy-base">
                👹
            </div>

        </div>
    </div>

</div>

<hr>

<div>
    Player Base HP:
    <span id="playerBaseHp">1000</span>
</div>

<br>

<div id="battleLog">
Battle Started...
</div>

<br>

<button onclick="window.location.href='menu.html'">
Return To Menu
</button>

<script src="js/game.js"></script>

</body>
</html>
